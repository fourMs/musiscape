[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musiscape"
# Single source of truth: src/musiscape/__init__.py.
# __version__ had drifted from the packaged version (0.3.2 shipped
# reporting 0.3.1) because the bump touched only this file, so the
# number now lives in one place and setuptools reads it from there.
dynamic = ["version"]
description = "A Python toolbox for analysing large music collections and long music recordings"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Refsum Jensenius" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "micromotion>=1.8.0",
]

[project.optional-dependencies]
tags = ["mutagen>=1.46"]

[project.scripts]
musiscape = "musiscape.cli:main"

[tool.setuptools.dynamic]
version = { attr = "musiscape.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
