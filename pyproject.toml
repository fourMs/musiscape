[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musiscape"
version = "0.3.0"
description = "A toolbox for analysing music collections: corpus fingerprints, similarity landscapes, and honest categorisation from folders of audio files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Alexander Refsum Jensenius" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "librosa>=0.10",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "ambiscape>=0.16",
]

[project.optional-dependencies]
tags = ["mutagen>=1.46"]

[project.scripts]
musiscape = "musiscape.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
